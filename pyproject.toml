[project]
version = "0.0.1"
name = "resample3"
description = "Special purpose python extension for resampling and projecting volume data."
readme = "README.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.8"

authors = [
    { name="Aaron Watters", email="awatters@flatironinstitute.org" },
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "numpy>=1.21",
]

[build-system]
requires = ["setuptools>=61", "wheel", "numpy>=1.21"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
demos = ["h5gizmos"]

[project.urls]
Homepage = "https://github.com/AaronWatters/resample3"
Issues = "https://github.com/AaronWatters/resample3/issues"
